<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CARD PICK · 로그인</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header__inner">
      <a href="{{ url_for('index') }}" class="brand" aria-label="CARD PICK 홈">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="3" fill="#111827"/><rect x="4" y="9" width="16" height="2" rx="1" fill="#fff" opacity=".75"/><rect x="4" y="13" width="6" height="2" rx="1" fill="#fff" opacity=".75"/></svg>
        <strong class="brand__text">CARD PICK</strong>
      </a>
      <nav class="nav" aria-label="주요">
        <a href="{{ url_for('recommend') }}" data-nav="recommend">카드픽추천</a>
        <a href="{{ url_for('browse') }}"    data-nav="browse">카드찾기</a>
        <a href="{{ url_for('compare') }}"   data-nav="compare">비교함</a>
      </nav>
      <div class="header__auth" id="authLinks"></div>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="container">
      <div class="auth-card">
        <h1>로그인</h1>
        <p class="muted">가입하신 이메일과 비밀번호를 입력해 주세요.</p>
        {% if error %}<p class="auth-note" style="color:#dc2626">{{ error }}</p>{% endif %}
        <form method="post" action="{{ url_for('login') }}">
          <div class="auth-row">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" required value="{{ email or '' }}" />
          </div>
          <div class="auth-row">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" required />
          </div>
          <div class="auth-actions">
            <div class="left">
              <button class="btn-primary" type="submit">로그인</button>
            </div>
            <div class="right">
              <span class="auth-note">처음이신가요?</span>
              <a class="btn-link" href="{{ url_for('signup') }}">회원가입</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container muted">© 2025 CARD PICK</div>
  </footer>
</body>
</html>
